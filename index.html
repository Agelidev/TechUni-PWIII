<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo seletivo - TechUni</title>
</head>
<body>
    <h1>Inscrição</h1>
    <div id="formulário">
        <form action="processa_inscricao.php" method="POST">
        <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
        </div>

        <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
        </div>

        <div>
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Digite sua idade" min="16" max="90" required>
        </div>  

        <div>
        <label for="media">Média ensino médio:</label>
        <input type="number" id="media" name="media" placeholder="Digite sua média" step="0.1" min="0" max="10" required>
        </div>  

        <label for="curso">Curso pretendido:</label>
        <select id="curso" name="curso" required>
            <option value="" disabled selected>Selecione um curso...</option>
            <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
            <option value="ES">Engenharia de Software</option>
            <option value="SI">Sistemas de Informação</option>
        </select>

        <input type="checkbox" id="termos" name="termos" value="sim" required>
        <label for="termos">Eu declaro que li e aceito os Termos</label>


        <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
