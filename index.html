<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Processo seletivo - TechUni</title>
</head>
<body class="bg-[#0A2239] font-mono">
    <div id="formulário" class="justify-center bg-[#C1DEEB]/70 p-8 rounded-lg mt-60">
        <div class="flex flex-col items-center">
        <h1 class="text-3xl font-bold text-center text-[#0A2239] mb-4 ">Inscrição</h1>
        <form action="processa_inscricao.php" method="POST">

        <div class="mb-2 text-[#0A2239]">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required class="bg-[#C1DEEB] p-1 rounded-lg">
        </div>

        <div class="mb-2 text-[#0A2239]">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required class="bg-[#C1DEEB] p-1 rounded-lg">
        </div>

        <div class="mb-2 text-[#0A2239]">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="16" max="90" required class="bg-[#C1DEEB] p-1 rounded-lg">
        </div>  

        <div class="mb-2 text-[#0A2239] ">
        <label for="media">Média ensino médio:</label>
        <input type="number" id="media" name="media" placeholder="Digite sua média" step="0.1" min="0" max="10" required class="bg-[#C1DEEB] p-1 rounded-lg">
        </div>  

        <div class="mb-2 text-[#0A2239]">
        <label for="curso">Curso pretendido:</label>
        <select id="curso" name="curso" required class="bg-[#C1DEEB] p-1 rounded-lg">
            <option value="" disabled selected>Selecione um curso...</option>
            <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
            <option value="ES">Engenharia de Software</option>
            <option value="SI">Sistemas de Informação</option>
        </select>
        </div>
        
        <div class="mb-2">
        <input type="checkbox" id="termos" name="termos" value="sim" required>
        <label for="termos">Eu declaro que li e aceito os Termos</label>
        </div>

        <button type="submit" class="bg-[#0A2239] p-2 text-[#C1DEEB] rounded-lg hover:bg-[#176087]" >Enviar</button>
        </form>
        </div>

    </div>

    <tbody></tbody>
</body>
</html>
